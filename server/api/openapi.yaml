    Manifest:
      x-go-type: review.Manifest
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      description: |
        Review content written by an author (typically the implementing agent). Entities reference
        each other by keys unique per entity kind. Agent-authored intents, changes, findings and
        attention are stored as INFERRED and changes as UNVERIFIED. CODE_RANGE evidence must point
