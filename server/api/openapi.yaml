      additionalProperties: false
      properties:
        revision_id: { type: [string, "null"] }
        editable: { type: boolean }
        graph:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ReviewGraph"
        unavailable_reason: { type: [string, "null"], description: Non-null when semantic history was not recorded. Source and threads remain available. }

    ReviewGraph:
