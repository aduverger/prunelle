        changes: { type: array, items: { $ref: "#/components/schemas/ObservedChange" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        attention: { type: array, items: { $ref: "#/components/schemas/AttentionSignal" } }
        representations: { type: array, items: { $ref: "#/components/schemas/Representation" } }
