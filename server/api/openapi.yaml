            additionalProperties: false
            properties:
              key: { type: string }
              target:
                type: object
                required: [type, key]
                additionalProperties: false
                properties:
                  type: { type: string, enum: [TOPIC, CHANGE, FINDING] }
                  key: { type: string }
              priority: { type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN] }
              rationale: { type: string }
              uncertainty: { type: string }
              evidence: { $ref: "#/components/schemas/KeyList" }

