      properties:
        author: { $ref: "#/components/schemas/Author" }
        intents:
          type: array
          items:
            type: object
            required: [key, kind, statement, source]
            additionalProperties: false
            properties:
              key: { type: string }
              kind: { type: string, enum: [BEHAVIOR, CONSTRAINT] }
              statement: { type: string }
              source: { type: string }
              acceptance_criteria: { type: string }
              provenance: { $ref: "#/components/schemas/Provenance" }
              evidence: { $ref: "#/components/schemas/KeyList" }
        evidence:
          type: array
          items:
            type: object
            required: [key, kind, title]
            additionalProperties: false
            properties:
              key: { type: string }
              kind: { type: string, enum: [CODE_RANGE, TEST_RESULT, SPECIFICATION, ANALYSIS_OUTPUT, ARTIFACT] }
              title: { type: string }
              content: { type: string }
              source: { type: string }
              provenance: { $ref: "#/components/schemas/Provenance" }
              code_range:
                type: object
                required: [repository, path, side, start_line, end_line]
                additionalProperties: false
                properties:
                  repository: { type: string, description: Repository label. }
                  path: { type: string }
                  side: { type: string, enum: [BASE, HEAD] }
                  start_line: { type: integer, minimum: 1 }
                  end_line: { type: integer, minimum: 1 }
        changes:
          type: array
          items:
            type: object
            required: [key, kind, summary, before, after]
            additionalProperties: false
            properties:
              key: { type: string }
              kind: { type: string, enum: [BEHAVIOR, INTERFACE, DATA, DEPENDENCY, CONFIGURATION, UI, OTHER] }
              summary: { type: string }
              before: { type: string }
              after: { type: string }
              components: { type: array, items: { type: string } }
              verification_status: { type: string, enum: [UNVERIFIED, SUPPORTED, CONTRADICTED] }
              provenance: { $ref: "#/components/schemas/Provenance" }
              evidence: { $ref: "#/components/schemas/KeyList" }
        findings:
          type: array
          items:
            type: object
            required: [key, kind, severity, title, rationale]
            additionalProperties: false
            properties:
              key: { type: string }
              kind: { type: string, enum: [CORRECTNESS, DESIGN, SECURITY, PERFORMANCE, TEST_GAP, OTHER] }
              severity: { type: string, enum: [HIGH, MEDIUM, LOW, INFO] }
              title: { type: string }
              rationale: { type: string }
              provenance: { $ref: "#/components/schemas/Provenance" }
              evidence: { $ref: "#/components/schemas/KeyList" }
        topics:
          type: array
          description: A parent must be listed before its children.
          items:
            type: object
            required: [key, title, summary]
            additionalProperties: false
            properties:
              key: { type: string }
              parent: { type: string }
              title: { type: string }
              summary: { type: string }
              intents: { $ref: "#/components/schemas/KeyList" }
              changes: { $ref: "#/components/schemas/KeyList" }
              findings: { $ref: "#/components/schemas/KeyList" }
              evidence: { $ref: "#/components/schemas/KeyList" }
              representations:
                type: array
                items:
                  type: object
                  required: [type]
                  additionalProperties: false
                  properties:
                    type: { type: string, enum: [TEXT, DIAGRAM, CODE_DIFF, EVIDENCE_LIST] }
                    title: { type: string }
                    text:
                      type: object
                      required: [sections]
                      additionalProperties: false
                      properties:
                        sections:
                          type: array
                          items:
                            type: object
                            required: [heading, body]
                            additionalProperties: false
                            properties:
                              heading: { type: string }
                              body: { type: string }
                              evidence: { $ref: "#/components/schemas/KeyList" }
                    diagram:
                      type: object
                      required: [nodes]
                      additionalProperties: false
                      properties:
                        nodes:
                          type: array
                          items:
                            type: object
                            required: [id, label, kind]
                            additionalProperties: false
                            properties:
                              id: { type: string }
                              label: { type: string }
                              kind: { type: string, enum: [COMPONENT, SERVICE, DATASTORE, QUEUE, ACTOR, STEP, STATE, OTHER] }
                              ref: { $ref: "#/components/schemas/ManifestRef" }
                              evidence: { $ref: "#/components/schemas/KeyList" }
                        edges:
                          type: array
                          items: { $ref: "#/components/schemas/DiagramEdge" }
                    code_diff:
                      type: object
                      additionalProperties: false
                      properties:
                        evidence: { $ref: "#/components/schemas/KeyList" }
                    evidence_list:
                      type: object
                      additionalProperties: false
                      properties:
                        evidence: { $ref: "#/components/schemas/KeyList" }
        attention:
