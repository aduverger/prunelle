openapi: 3.1.0
info:
  title: Prunelle Review API
  version: 0.1.0
  description: |
    Review server API. All routes except `/v1/health` require a caller identity:
    a `Tailscale-User-Login` header set by Tailscale Serve, or a loopback request without
    Tailscale headers (the machine owner). The caller is the author of every change it makes.
    An agent acting through that login names itself with a `Prunelle-Agent` header (e.g.
    `pi:<session-id>`): its changes are authored by that AGENT, and events keep the login.
    The agent name is declared, not verified. Only humans submit decisions.
    Errors use the `Error` envelope.

    Mutable resources carry a `version`; single-resource responses return it as `ETag: "<version>"`,
    and updates require `If-Match` with that value (428 without it, 412 when stale).
    Requests that create something accept an `Idempotency-Key`: repeating the key with the same
    request returns the stored response (`Idempotent-Replayed: true`) for 24 hours unless its owning review is explicitly deleted.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:7390
tags:
  - name: system
  - name: reviews
  - name: revisions
  - name: content
  - name: discussions
  - name: events
  - name: agents
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        "200":
          description: Server is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      responses:
        "200":
          description: Reviews with their owned repository context.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [reviews]
      operationId: createReview
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReviewRequest" }
      responses:
        "201":
          description: Created review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/resolve:
    get:
      tags: [reviews]
      operationId: resolveReview
      description: Resolve a server-side directory to exactly one review using its source context or repository membership. Zero or multiple matches require explicit selection.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The sole matching review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [reviews]
      operationId: getReview
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [reviews]
      operationId: deleteReview
      description: Hard-delete this review and its owned Prunelle content/receipts, never project files, Git history or runtimes. Shared source identities/blobs and other reviews are preserved. Repeating an absent ID succeeds.
      responses:
        "204":
          description: Review deleted or already absent.
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [revisions]
      operationId: listRevisions
      responses:
        "200":
          description: Revisions ordered by ordinal.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Revision" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [revisions]
      operationId: captureRevision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: Capture the declared review repository set using per-repository overrides, then a capture-wide base ref, then the server snapshot default. No fetch or branch switch. A committed idempotent retry returns its original revision even if defaults change.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureRequest" }
      responses:
        "201":
          description: Captured revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [revisions]
      operationId: getRevision
      responses:
        "200":
          description: The revision and its repository snapshots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/revisions/{revisionId}/source-changes:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [revisions]
      operationId: getSourceChanges
      description: Every changed file of the revision with the topics it belongs to. Files belonging to no topic are flagged unassigned.
      responses:
        "200":
          description: Changed files per repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceChanges" }
        default: { $ref: "#/components/responses/Error" }
  /v1/revisions/{revisionId}/file:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    get:
      tags: [revisions]
      operationId: getFile
      description: A changed file of the revision with its stored base and head text.
      parameters:
        - name: repository_id
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/revision-view:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [revisions]
      operationId: getRevisionView
      description: One coherent semantic view. Latest state is editable; predecessors freeze when capture advances. Legacy unavailable history is null, never today's graph.
      parameters:
        - name: revision_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Selected semantic state and canonical source membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionView" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/comparison:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [revisions]
      operationId: compareRevisions
      parameters:
        - name: from_revision_id
          in: query
          required: true
          schema: { type: string }
        - name: to_revision_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stable-ID semantic changes; source changes are separate and never automatically resolve concerns.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionComparison" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/anchor-status:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [discussions]
      operationId: getDiscussionAnchorStatuses
      parameters:
        - name: revision_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conservative original-anchor validity against a target revision; no relocation.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DiscussionAnchorStatus" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/revisions/{revisionId}/source-topics:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    patch:
      tags: [content]
      operationId: updateSourceTopics
      description: Set an explicit topic set (including empty), or reset to DERIVED. Only the current revision is writable; initial assignment version is 1.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSourceTopicsRequest" }
      responses:
        "200":
          description: Updated canonical file assignment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceFile" }
        default: { $ref: "#/components/responses/Error" }
  /v1/findings/{findingId}:
    parameters:
      - name: findingId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [content]
      operationId: updateFinding
      description: Explicit status/evidence edit against the current revision. Does not resolve threads, rewrite first-seen revision or submit a decision.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFindingRequest" }
      responses:
        "200":
          description: Updated finding.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/imports:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listImports
      responses:
        "200":
          description: Manifest imports with their authors.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Import" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [content]
      operationId: importManifest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: Append records atomically against the current revision. Superseded revisions reject new imports; committed retries still replay unchanged. Keys are import-local, not reconciliation identities.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Import result with the IDs assigned to manifest keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/topics:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listTopics
      description: Topics ordered roots first, then children by parent and position. Build the tree from parent_id.
      responses:
        "200":
          description: Topics.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Topic" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [content]
      operationId: createTopic
      description: Create a MANUAL topic, last among its siblings.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTopicRequest" }
      responses:
        "201":
          description: Created topic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        default: { $ref: "#/components/responses/Error" }
  /v1/topics/{topicId}:
    parameters:
      - $ref: "#/components/parameters/TopicId"
    get:
      tags: [content]
      operationId: getTopic
      responses:
        "200":
          description: The topic and its direct links.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [content]
      operationId: updateTopic
      description: Change the fields present. A link list replaces the topic's links of that kind. OBSOLETE topics no longer claim changed files.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTopicRequest" }
      responses:
        "200":
          description: Updated topic.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        default: { $ref: "#/components/responses/Error" }
  /v1/topics/{topicId}/move:
    parameters:
      - $ref: "#/components/parameters/TopicId"
    post:
      tags: [content]
      operationId: moveTopic
      description: Place the topic under a parent (null for the root) at a position among its siblings, clamped to the end. Siblings whose position changes get a new version.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveTopicRequest" }
      responses:
        "200":
          description: Moved topic.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        default: { $ref: "#/components/responses/Error" }
  /v1/topics/{topicId}/representations:
    parameters:
      - $ref: "#/components/parameters/TopicId"
    get:
      tags: [content]
      operationId: listTopicRepresentations
      description: |
        Stored representations plus one entry per missing MVP type. Missing code and evidence views
        are derived from topic links (origin DERIVED); missing text and diagram views are reported
        unavailable (origin NONE).
      responses:
        "200":
          description: Representations.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Representation" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [content]
      operationId: createRepresentation
      description: Add a MANUAL representation authored against the review's current revision. Give the config matching the type; references are record IDs of the review.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepresentationRequest" }
      responses:
        "201":
          description: Created representation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Representation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/representations/{representationId}:
    parameters:
      - name: representationId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [content]
      operationId: updateRepresentation
      description: Change the title, and replace the config when one is given. The type cannot change.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepresentationRequest" }
      responses:
        "200":
          description: Updated representation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Representation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/intents:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listIntents
      responses:
        "200":
          description: Intents.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Intent" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/changes:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listChanges
      parameters:
        - name: revision_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Observed changes.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ObservedChange" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/findings:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listFindings
      responses:
        "200":
          description: Findings ordered by severity.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/evidence:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listEvidence
      responses:
        "200":
          description: Evidence.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/attention:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [content]
      operationId: listAttention
      responses:
        "200":
          description: Attention signals. A priority is a reason to look, not a defect probability.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AttentionSignal" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/evidence/{evidenceId}:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [content]
      operationId: getEvidence
      responses:
        "200":
          description: The evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Error" }

  /v1/reviews/{reviewId}/discussions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [discussions]
      operationId: listDiscussions
      responses:
        "200":
          description: Discussions with their messages, oldest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Discussion" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [discussions]
      operationId: createDiscussion
      description: Open a discussion on an anchor with its first message. Commenting never changes code or starts work.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiscussionRequest" }
      responses:
        "201":
          description: Created discussion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discussion" }
        default: { $ref: "#/components/responses/Error" }
  /v1/discussions/{discussionId}:
    parameters:
      - $ref: "#/components/parameters/DiscussionId"
    get:
      tags: [discussions]
      operationId: getDiscussion
      responses:
        "200":
          description: The discussion.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discussion" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [discussions]
      operationId: updateDiscussion
      description: Resolve or reopen.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDiscussionRequest" }
      responses:
        "200":
          description: Updated discussion.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discussion" }
        default: { $ref: "#/components/responses/Error" }
  /v1/discussions/{discussionId}/messages:
    parameters:
      - $ref: "#/components/parameters/DiscussionId"
    post:
      tags: [discussions]
      operationId: createMessage
      description: Reply. The discussion gets a new version.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "201":
          description: Created message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/decisions:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [discussions]
      operationId: listDecisions
      responses:
        "200":
          description: Decisions, oldest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [discussions]
      operationId: createDecision
      description: |
        Record a verdict on a revision (default the current one). COMMENT needs a body.
        REQUEST_CHANGES selects at least one finding or discussion of the review; other verdicts select none.
        Decisions are never modified.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDecisionRequest" }
      responses:
        "201":
          description: Created decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/events:
    get:
      tags: [events]
      operationId: streamEvents
      description: |
        Server-sent events, one per change, in sequence order. Each SSE message has `id` = sequence,
        `event` = event type, and `data` = an `Event`. The stream resumes after `Last-Event-ID`, else
        after `after`, else from now. It opens with a `ready` event whose data is `{"sequence": N}`
        (the sequence it resumes from): fetch or refetch state then. Comments keep the connection alive.
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }


  /v1/agent-sessions:
    get:
      tags: [agents]
      operationId: listAgentSessions
      responses:
        "200":
          description: Registered logical Pi conversations and current connection readiness.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentSession" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [agents]
      operationId: registerAgentSession
      description: Pi self-registration; actor must be pi:<external_id>. Direct loopback registrations may participate in canonical cwd matching; proxied/remote paths do not.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAgentSessionRequest" }
      responses:
        "200":
          description: Registered Pi identity, not an execution authorization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-sessions/{agentSessionId}/connect:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      tags: [agents]
      operationId: connectAgentSession
      description: Pi-only live SSE dispatch connection. Opens with ready/connection_id, then request frames containing AgentInvocation. No event IDs or execution replay; reconnect does not resend commands.
      responses:
        "200":
          description: Cancellable live command stream, not the durable review event log.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-sessions/{agentSessionId}/state:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    put:
      tags: [agents]
      operationId: updateAgentSessionState
      description: The connected Pi reports actual readiness/model/checkpoint for its current connection ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSessionStateRequest" }
      responses:
        "200":
          description: Current Pi state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/agent-binding:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [agents]
      operationId: getAgentBinding
      responses:
        "200":
          description: Authoritative selection and currently matching candidates. Version 1 when no choice exists.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBinding" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [agents]
      operationId: setAgentBinding
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      description: Select a Pi, deliberately disconnect, or explicitly restore automatic matching. No request is dispatched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentBindingRequest" }
      responses:
        "200":
          description: Updated selection.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBinding" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reviews/{reviewId}/agent-invocations:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      tags: [agents]
      operationId: listAgentInvocations
      responses:
        "200":
          description: Review-owned requests/results, oldest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentInvocation" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [agents]
      operationId: createAgentInvocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: Explicit human action only. Resolve a unique unbound candidate, reject busy/unavailable, persist and send once over the live Pi connection. Committed replay never dispatches again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentInvocationRequest" }
      responses:
        "202":
          description: Persisted request; acceptance is not proof of execution/completion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInvocation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-invocations/{invocationId}:
    parameters:
      - $ref: "#/components/parameters/InvocationId"
    get:
      tags: [agents]
      operationId: getAgentInvocation
      responses:
        "200":
          description: Current request state, including explicit uncertainty if its original connection is gone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInvocation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-invocations/{invocationId}/context:
    parameters:
      - $ref: "#/components/parameters/InvocationId"
    get:
      tags: [agents]
      operationId: getAgentInvocationContext
      responses:
        "200":
          description: Captured revision context and eligible files; generation rejects changed semantic inputs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInvocationContext" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-invocations/{invocationId}/state:
    parameters:
      - $ref: "#/components/parameters/InvocationId"
    post:
      tags: [agents]
      operationId: updateAgentInvocation
      description: Target Pi only; report running, definite failure or uncertainty without overwriting a committed result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentInvocationRequest" }
      responses:
        "200":
          description: Updated request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInvocation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-invocations/{invocationId}/complete:
    parameters:
      - $ref: "#/components/parameters/InvocationId"
    post:
      tags: [agents]
      operationId: completeAgentInvocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: Target Pi publishes one structured result atomically. Domain deduplication also protects independent keys, restart, and receipt expiry. Conflicting results reject.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteAgentInvocationRequest" }
      responses:
        "200":
          description: Committed reply, generation or implementation summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInvocation" }
        default: { $ref: "#/components/responses/Error" }


components:
  parameters:
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string }
    TopicId:
      name: topicId
      in: path
      required: true
      schema: { type: string }
    AgentSessionId:
      name: agentSessionId
      in: path
      required: true
      schema: { type: string }
    InvocationId:
      name: invocationId
      in: path
      required: true
      schema: { type: string }
    DiscussionId:
      name: discussionId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen unique key that makes a retried request safe.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version the change is based on. Required; omitting it returns 428.
      schema: { type: string }

  headers:
    ETag:
      description: The resource version, quoted.
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [NOT_FOUND, INVALID_ARGUMENT, CONFLICT, CAPTURE_FAILED, PRECONDITION_FAILED, PRECONDITION_REQUIRED, UNAUTHENTICATED, PERMISSION_DENIED, INTERNAL]
            message: { type: string }
            details: { type: array, items: { type: string } }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Provenance:
      type: string
      enum: [MEASURED, OBSERVED, INFERRED, UNKNOWN]
      description: "How the author knows: MEASURED (tool output such as a test run), OBSERVED (seen directly in code or artifacts), INFERRED (reasoning or judgment), UNKNOWN. Stored as the author declares it."

    Repository:
      x-go-type: review.Repository
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [id, review_id, label, root_path, include_untracked]
      additionalProperties: false
      properties:
        id: { type: string }
        review_id: { type: string }
        label: { type: string }
        root_path: { type: string, description: Canonical source path on the server. }
        include_untracked: { type: boolean }

    CreateRepositoryRequest:
      x-go-type: review.CreateRepositoryRequest
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [label, path]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        include_untracked: { type: boolean }

    Review:
      x-go-type: review.Review
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [id, context_path, repositories, title, description, status, current_revision_id, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string }
        context_path: { type: [string, "null"] }
        repositories: { type: array, items: { $ref: "#/components/schemas/Repository" } }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        current_revision_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateReviewRequest:
      x-go-type: review.CreateReviewRequest
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      additionalProperties: false
      oneOf:
        - required: [path]
          properties:
            path: { type: string, minLength: 1 }
            repositories: { type: "null" }
        - required: [repositories]
          properties:
            path: { type: "null" }
            repositories: { type: array, minItems: 1, items: { $ref: "#/components/schemas/CreateRepositoryRequest" } }
            infer_context: { enum: [false] }
      properties:
        path: { type: [string, "null"], minLength: 1, description: Absolute server-side source target; a repository or container of immediate repositories. }
        infer_context: { type: boolean, description: Resolve cwd through one existing containing review context before validating source. Explicit paths omit this flag. }
        repositories: { type: [array, "null"], minItems: 1, items: { $ref: "#/components/schemas/CreateRepositoryRequest" } }
        title: { type: string, minLength: 1, description: Defaults to the source folder or repository labels. }
        description: { type: string }

    RepositoryBaseRef:
      x-go-type: review.RepositoryBaseRef
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [repository_id, base_ref]
      additionalProperties: false
      properties:
        repository_id: { type: string, minLength: 1 }
        base_ref: { type: string, minLength: 1 }

    CaptureRequest:
      x-go-type: review.CaptureRequest
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      additionalProperties: false
      properties:
        base_ref: { type: string, minLength: 1 }
        repository_base_refs: { type: array, items: { $ref: "#/components/schemas/RepositoryBaseRef" } }

    Revision:
      x-go-type: review.Revision
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [id, review_id, ordinal, captured_at, fingerprint, status, snapshots]
      additionalProperties: false
      properties:
        id: { type: string }
        review_id: { type: string }
        ordinal: { type: integer, minimum: 1 }
        captured_at: { type: string, format: date-time }
        fingerprint: { type: string }
        status:
          type: string
          enum: [CONSISTENT, INCONSISTENT]
          description: INCONSISTENT when a repository kept changing during capture; snapshots may mix states.
        snapshots: { type: array, items: { $ref: "#/components/schemas/RepoSnapshot" } }

    RepoSnapshot:
      x-go-type: review.RepoSnapshot
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [repository_id, repository_label, base_ref, base_sha, head_sha, branch, staged_count, unstaged_count, untracked_count, file_count, status, warnings]
      additionalProperties: false
      properties:
        repository_id: { type: string }
        repository_label: { type: string }
        base_ref: { type: string }
        base_sha: { type: string, description: "merge-base(HEAD, base_ref)" }
        head_sha: { type: string }
        branch: { type: string, description: Empty when HEAD is detached. }
        staged_count: { type: integer }
        unstaged_count: { type: integer }
        untracked_count: { type: integer }
        file_count: { type: integer }
        status: { type: string, enum: [CONSISTENT, INCONSISTENT] }
        warnings: { type: array, items: { type: string } }

    FileStatus:
      type: string
      enum: [ADDED, MODIFIED, DELETED, RENAMED, TYPE_CHANGED, UNTRACKED]

    ContentOmitted:
      type: [string, "null"]
      enum: [BINARY, TOO_LARGE, SUBMODULE, NOT_A_REGULAR_FILE, null]
      description: Why the file is listed without contents.

    SourceChanges:
      x-go-type: review.SourceChanges
      x-go-type-import: { path: github.com/aduverger/prunelle/server/internal/review }
      type: object
      required: [revision_id, repositories, unassigned_count, assignments_available]
      additionalProperties: false
      properties:
        revision_id: { type: string }
        unassigned_count: { type: integer }
        assignments_available: { type: boolean, description: False for legacy revisions with unknown semantic history; do not interpret their empty topic sets as unassigned. }
        repositories:
          type: array
          items:
            type: object
            required: [repository_id, repository_label, files]
            additionalProperties: false
            properties:
              repository_id: { type: string }
              repository_label: { type: string }
              files:
                type: array
                items: { $ref: "#/components/schemas/SourceFile" }

    RevisionView:
